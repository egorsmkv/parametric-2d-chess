name: CI

# Runs on every commit. The Space is only updated when the tests pass on the
# default branch, so a red commit can never reach production.
on:
  push:
  workflow_dispatch:

concurrency:
  # One run per branch; a newer commit cancels an in-flight run of the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # The `app` extra pulls in gradio so the app tests really run here
        # instead of being skipped -- this job gates the deploy.
        run: uv sync --extra app

      - name: Lint
        run: uv run --extra app ruff check .

      - name: Type-check
        run: uv run --extra app mypy

      - name: Run tests
        run: uv run --extra app pytest

      - name: Verify the Space payload assembles
        run: uv run --extra app python scripts/deploy_space.py --space-id dry/run --dry-run

  deploy:
    name: Deploy to Hugging Face Space
    needs: test
    # Only real commits on the default branch publish; PRs and other branches
    # stop after the test job above.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: huggingface
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE_ID || 'egorsmkv/parametric-2d-chess' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check deploy credentials
        id: creds
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning title=Deploy skipped::HF_TOKEN secret is not set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to the Space
        if: steps.creds.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_COMMIT_MESSAGE: "Deploy ${{ github.sha }} from ${{ github.repository }}"
        run: |
          uv run --with huggingface_hub python scripts/deploy_space.py \
            --space-id "${{ vars.HF_SPACE_ID || 'egorsmkv/parametric-2d-chess' }}"

      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.ready }}" = "true" ]; then
            echo "Deployed to https://huggingface.co/spaces/${{ vars.HF_SPACE_ID || 'egorsmkv/parametric-2d-chess' }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deploy skipped: add an \`HF_TOKEN\` secret to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

  image:
    name: Build the Space image and slice in it
    # Manual only: this downloads a ~250 MB Bambu Studio AppImage and builds a
    # multi-GB image, which is far too slow to gate every commit. Run it after
    # touching space/Dockerfile, or when a new Bambu Studio release lands --
    # nothing else in CI proves the slicer actually works.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Assemble the Space payload
        run: |
          uv run --extra app python scripts/deploy_space.py \
            --space-id local/build --dry-run --staging build/space

      - name: Build the image
        run: docker build -t chess2d-space build/space

      - name: Slice a plate inside the container
        # The real end-to-end check: Bambu Studio has to be found, run headless
        # and write a .gcode.3mf. A generic 3MF passing is not enough.
        run: |
          docker run --rm chess2d-space python - <<'PY'
          from pathlib import Path
          from chess2d.bambu import (
              PRINTERS, export_plate_3mf, find_bambu_studio, slice_with_bambu_studio,
          )

          binary = find_bambu_studio()
          assert binary, "Bambu Studio not found in the image"
          print(f"Bambu Studio: {binary}")

          plate, layout = export_plate_3mf("/tmp/plate.3mf")
          print(layout.summary())

          printer = PRINTERS["Bambu Lab P1S"]
          sliced = slice_with_bambu_studio(
              plate, "/tmp/plate.gcode.3mf",
              machine=printer.machine_profile, process=printer.process_profile,
          )
          size = Path(sliced).stat().st_size
          print(f"sliced -> {sliced} ({size / 1e6:.1f} MB)")
          assert size > 10_000, "the sliced file is suspiciously small"
          PY
