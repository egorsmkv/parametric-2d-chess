[project]
name = "chess-in-build123d"
version = "0.1.0"
description = "Parametric 2D chessboard and chess-piece silhouettes generated with build123d"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "build123d>=0.11.1",
]

[project.optional-dependencies]
preview = [
    "ocp-vscode>=2.0.0",
]
app = [
    "gradio>=4.44",
]

[project.scripts]
chess2d-app = "chess2d.gradio_app:main"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=8.0.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess2d"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/chess2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
